name: Build and push to GHCR

# Builds the patched branch (upstream dev plus our fixes) as ghcr.io/marck/aerofoil.
# Run it manually to build patched merged with the newest upstream branch. The merge is
# not pushed: GITHUB_TOKEN may not push upstream's edits to its own workflow files.
on:
  push:
    branches: [patched]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch to merge into patched first (empty builds patched as is)
        default: dev

concurrency:
  group: ghcr-patched
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      MERGE: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_ref != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patched
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        if: env.MERGE == 'true'
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          git config user.name Marck
          git config user.email marc@github.com
          echo "patched=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          git fetch --tags https://github.com/luketanti/AeroFoil.git "$REF"
          echo "upstream=$(git rev-parse --short=7 FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          echo "describe=$(git describe --tags --always FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          git merge --no-edit -m "Merge upstream $REF into patched" FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Merged builds are tagged dev-<upstream>-<patched>, both commits reachable on GitHub.
      - id: meta
        env:
          UPSTREAM: ${{ steps.merge.outputs.upstream }}
          PATCHED: ${{ steps.merge.outputs.patched }}
          DESCRIBE: ${{ steps.merge.outputs.describe }}
        run: |
          if [ -n "$UPSTREAM" ]; then
            echo "tag=dev-$UPSTREAM-$PATCHED" >> "$GITHUB_OUTPUT"
            echo "version=$DESCRIBE-patched.$PATCHED" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
            echo "version=$(git describe --tags --always)-patched" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: AEROFOIL_VERSION=${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/marck/aerofoil:latest
            ghcr.io/marck/aerofoil:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: echo "Pushed \`ghcr.io/marck/aerofoil:${{ steps.meta.outputs.tag }}\` (${{ steps.meta.outputs.version }})." >> "$GITHUB_STEP_SUMMARY"
