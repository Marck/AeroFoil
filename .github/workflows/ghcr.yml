name: Build and push to GHCR

# Builds the patched branch (upstream dev plus our fixes) as ghcr.io/marck/aerofoil.
# Run it manually to merge the newest upstream branch into patched first.
on:
  push:
    branches: [patched]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch to merge into patched first (empty builds patched as is)
        default: dev

concurrency:
  group: ghcr-patched
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      MERGE: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_ref != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patched
          fetch-depth: 0

      - name: Merge upstream
        if: env.MERGE == 'true'
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          git config user.name Marck
          git config user.email marc@github.com
          git fetch --tags https://github.com/luketanti/AeroFoil.git "$REF"
          git merge --no-edit -m "Merge upstream $REF into patched" FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests

      # A push made with GITHUB_TOKEN starts no new run, so this run builds the merge itself.
      - name: Push the merge
        if: env.MERGE == 'true'
        run: git push origin HEAD:patched

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always)-patched" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: AEROFOIL_VERSION=${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/marck/aerofoil:latest
            ghcr.io/marck/aerofoil:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: echo "Pushed \`ghcr.io/marck/aerofoil:sha-${{ steps.meta.outputs.sha }}\` (${{ steps.meta.outputs.version }})." >> "$GITHUB_STEP_SUMMARY"
